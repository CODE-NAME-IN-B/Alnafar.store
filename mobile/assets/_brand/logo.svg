<?xml version="1.0" encoding="UTF-8"?>
<!--
  شعار «النّفار» الأصلي — سيد الملف (القاعدة إن أُعيد توليد أي مستوى)
  البنية: حرف N بثلاث ضربات (سماكة موحّدة أطراف دائرية) + مربع lime أسفل اليمين
  الخلفية: forest؛ الضربات: كريمي؛ المربع: lime
  قواعد: لا تغيّر السماكة إلا بنسبة موحدة، والمربع لا يلمس الضربات أبداً.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .tile { fill: #2D6A4F; }
      .stroke { stroke: #F5F1E8; stroke-width: 52; stroke-linecap: round; }
      .lime { fill: #C5DE8F; }
    </style>
  </defs>

  <!-- البلاقة (تُحلّ بشفافية أو ألوان أخرى حسب السياق) -->
  <rect class="tile" x="0" y="0" width="1024" height="1024" rx="0"/>

  <!-- الضربة 1: العامود الأيسر -->
  <line class="stroke" x1="359" y1="282" x2="359" y2="506"/>
  <!-- الضربة 2: المائل أعلى-يسار → أسفل-يمين -->
  <line class="stroke" x1="359" y1="292" x2="556" y2="518"/>
  <!-- الضربة 3: العامود الأيمن -->
  <line class="stroke" x1="556" y1="282" x2="556" y2="506"/>

  <!-- المربع lime أسفل اليمين -->
  <rect class="lime" x="643" y="628" width="135" height="135" rx="27"/>
</svg>

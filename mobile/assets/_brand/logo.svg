<?xml version="1.0" encoding="UTF-8"?>
<!--
  شعار «النّفار» — السيد (مطابق للخيار أعلى اليمين من logos.png)
  البنية: بلاقة حبر بزوايا دائرية؛ N من شرائح كريمية حادة الأركان
  (عامودان + قطر يربط أعلى اليسار بأسفل اليمنى)؛ مربعان lime أسفل
  اليمين بتدرُّج سلّمي (A flush أسفل الشريحة اليمنى، B سلّم تحتها لليسار).
  قواعد: لا أطراف دائرية على الشرائح؛ الشبكة عمودية على ذراع Y واحدة
  (top=0.12، bottom=0.74، r_y1=0.44)؛ المربعان على شبكة 0.15.
  كل أصول الرمز ولدت من هذا الإحداثي (gen_brand2).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect fill="#1B2A21" x="0" y="0" width="1000" height="1000" rx="190.0"/>
  <!-- الضربة 1: الشرائح اليسرى -->
  <rect fill="#F5F1E8" x="160.0" y="175.0" width="215.0" height="650.0"/>
  <!-- الضربة 3: الشرائح اليمنى (ذراع قصيرة) -->
  <rect fill="#F5F1E8" x="625.0" y="175.0" width="215.0" height="345.0"/>
  <!-- الضربة 2: القطر -->
  <polygon fill="#F5F1E8" points="375.0,175.0 575.0,175.0 625.0,520.0 430.0,520.0"/>
  <!-- المربع A -->
  <rect fill="#C5DE8F" x="655.0" y="520.0" width="155.0" height="155.0"/>
  <!-- المربع B -->
  <rect fill="#C5DE8F" x="500.0" y="675.0" width="155.0" height="150.0"/>
</svg>

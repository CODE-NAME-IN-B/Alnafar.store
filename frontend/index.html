  <!-- Critical CSS inline for faster first paint -->
  <style>
    body{margin:0;background:#0f1724;color:#e2e8f0;font-family:'Cairo','Inter',sans-serif}
    #root{min-height:100vh}
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    // Register Service Worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // لا تسجل sw.js في صفحة التتبع (لتجنب التعارض مع service-worker.js الخاص بالإشعارات)
        if (window.location.hash && window.location.hash.startsWith('#/track/')) return;

        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);
            // التحديثات تتم تلقائياً بدون إزعاج المستخدم
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }

    // PWA Install Prompt — لا تظهر في صفحة التتبع
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // لا تظهر في صفحة التتبع
      if (window.location.hash && window.location.hash.startsWith('#/track/')) return;
      showInstallPromotion();
    });

    function showInstallPromotion() {
      if (document.getElementById('install-button')) return;
      const installButton = document.createElement('button');
      installButton.id = 'install-button';
      installButton.innerHTML = '📱 تثبيت التطبيق';
      installButton.style.cssText = `
          position: fixed;
          bottom: 20px;
          right: 20px;
          background: #14b8a6;
          color: white;
          border: none;
          padding: 12px 20px;
          border-radius: 25px;
          font-family: Cairo, sans-serif;
          font-weight: 600;
          cursor: pointer;
          box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
          z-index: 1000;
          transition: all 0.3s ease;
        `;

      installButton.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`User response to the install prompt: ${outcome}`);
          deferredPrompt = null;
          installButton.remove();
        }
      });

      document.body.appendChild(installButton);

      // Auto-hide after 10 seconds
      setTimeout(() => {
        if (installButton && installButton.parentNode) {
          installButton.style.opacity = '0';
          setTimeout(() => installButton.remove(), 300);
        }
      }, 10000);
    }

    // Handle app installation
    window.addEventListener('appinstalled', (evt) => {
      console.log('App was installed');
      // Hide install button if it exists
      const installButton = document.getElementById('install-button');
      if (installButton) {
        installButton.remove();
      }

      // Show success message
      const successMsg = document.createElement('div');
      successMsg.innerHTML = '✅ تم تثبيت التطبيق بنجاح!';
      successMsg.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          background: #10b981;
          color: white;
          padding: 12px 20px;
          border-radius: 8px;
          font-family: Cairo, sans-serif;
          z-index: 1001;
          box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        `;
      document.body.appendChild(successMsg);
      setTimeout(() => successMsg.remove(), 3000);
    });

    // Simple print function - opens browser print dialog like printatestpage.com
    window.enhancedPrint = function () {
      console.log('🖨️ Opening browser print dialog');
      window.print();
    };

    // Sunmi innerPrinter detection and setup
    window.addEventListener('load', function () {
      // Check for Sunmi innerPrinter availability
      if (typeof Android !== 'undefined' && Android.innerPrinter) {
        window.sunmiInnerPrinter = Android.innerPrinter;
        console.log('✅ Sunmi innerPrinter detected via Android interface');
      } else if (window.sunmiInnerPrinter) {
        console.log('✅ Sunmi innerPrinter already available');
      } else {
        console.log('ℹ️ Sunmi innerPrinter not detected, using web printing');
      }
    });
  </script>
</body>

</html>
